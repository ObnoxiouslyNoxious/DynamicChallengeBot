name: Post Dynamic Challenges

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-challenges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot/bot.py --post-now

      - name: Commit updated preview screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/latest-challenges.png
          git diff --staged --quiet || git commit -m "Update daily challenge preview screenshot"
          git push

      - name: Checkout NoxImages repository
        uses: actions/checkout@v4
        with:
          repository: ObnoxiouslyNoxious/NoxImages
          token: ${{ secrets.NOXIMAGES_PAT }}
          path: noximages

      - name: Publish preview screenshot to NoxImages
        run: |
          cp img/latest-challenges.png noximages/Misc/DCSLC.png
          cd noximages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Misc/DCSLC.png
          git diff --staged --quiet || git commit -m "Update DCSLC preview image"
          git push
